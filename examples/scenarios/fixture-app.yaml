name: fixture-app
caption:
  lang: en
  position: { page: bottom }
screens:
  - id: page
    url: http://127.0.0.1:5173/
    size: [800, 600]
layout: { direction: horizontal, border: 2 }
state:
  localStorage: ["fixture:*"]
  restoreViaBlankOrigin: true
  blankPath: /blank.html
mask: ["#user-email"]
timing: { stepTimeoutMs: 30000, pointerSteps: 12, pointerStepMs: 33 }
steps:
  - caption: "Open the fixture app"
  - click: { screen: page, target: "h1" }
    expect: { screen: page, selector: "h1" }
    retry: 2
  - dblclick: { screen: page, target: { text: "Click me" } }
  - click: { screen: page, target: { shadow: ["#shadow-host", "#shadow-button"] } }
  - script: scripts/set-title.js
  - wait: 800
